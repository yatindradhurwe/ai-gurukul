name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gurukul_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/gurukul_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Managed hosting usually gives a plain database user (no superuser, no
      # CREATEROLE). Run the whole suite again as such a user.
      - name: Test as a restricted database user
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE hostuser LOGIN PASSWORD 'hostpass' NOSUPERUSER NOCREATEROLE NOCREATEDB NOBYPASSRLS"
          psql -h localhost -U postgres -c "CREATE DATABASE gurukul_restricted_test OWNER hostuser"
          TEST_DATABASE_URL=postgres://hostuser:hostpass@localhost:5432/gurukul_restricted_test npm test
      - run: npm run build
