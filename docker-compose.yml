services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gurukul
      POSTGRES_PASSWORD: gurukul
      POSTGRES_DB: gurukul
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  dbdata:
